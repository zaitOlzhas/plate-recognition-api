services:
  lpr-webhook:
    build:
      context: .
      dockerfile: Dockerfile
    image: lpr-webhook-api:latest
    container_name: lpr-webhook
    restart: unless-stopped
    ports:
      - "5080:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_HTTP_PORTS: "8080"
      ConnectionStrings__Default: "Data Source=/data/events.db"
      # Leave empty to accept unauthenticated webhooks; set it (e.g. in .env) to require X-Api-Key.
      API_KEY: ${API_KEY:-}
      Swagger__Enabled: ${SWAGGER_ENABLED:-true}
      # Same plate + camera again within this many seconds of its last sighting is dropped. 0 = off.
      PlateEvents__DuplicateWindowSeconds: ${DUPLICATE_WINDOW_SECONDS:-30}
      # Only needed to open wwwroot/index.html from disk instead of http://<host>:5080/ — use "null" for that.
      Cors__AllowedOrigins: ${CORS_ALLOWED_ORIGINS:-}
      # Telegram Bot Configuration
      TelegramBot__Enabled: ${TELEGRAM_BOT_ENABLED:-false}
      TelegramBot__BotToken: ${TELEGRAM_BOT_TOKEN:-}
      # Your Telegram user ID (send /help to the bot). The owner is the first admin and promotes others.
      TelegramBot__OwnerUserId: ${TELEGRAM_OWNER_ID:-}
      # How admins' browsers reach this API, e.g. http://192.168.1.50:5080 - used for the /weblogin link.
      TelegramBot__WebBaseUrl: ${WEB_PUBLIC_URL:-}
      TelegramBot__Relay__BaseUrl: ${RELAY_BASE_URL:-http://192.168.1.10}
      TelegramBot__Relay__Endpoint: ${RELAY_ENDPOINT:-out1_pulse}
    volumes:
      - lpr-data:/data
    healthcheck:
      test: ["CMD", "dotnet", "LprWebhook.Api.dll", "--healthcheck"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

volumes:
  lpr-data:
